# ============================================================
# PATH B — Direct Booking (no recommendation)
# ============================================================

- story: direct booking path - happy path
  steps:
    - intent: greet
    - action: utter_greet
    - intent: want_booking
    - action: action_set_dialog_path        # sets dialog_path = "direct_booking"
    - action: utter_ask_restaurant_name
    - intent: inform
      entities:
        - restaurant_name: "Sushi Place"
    - action: booking_form
    - active_loop: booking_form
    - active_loop: null
    - action: action_handle_booking         # System B: difficulty injected here
    - intent: affirm
    - action: utter_booking_confirmed

- story: direct booking path - user denies booking confirmation
  steps:
    - intent: greet
    - action: utter_greet
    - intent: want_booking
    - action: action_set_dialog_path
    - action: utter_ask_restaurant_name
    - intent: inform
      entities:
        - restaurant_name: "Burger Bar"
    - action: booking_form
    - active_loop: booking_form
    - active_loop: null
    - action: action_handle_booking
    - intent: deny
    - action: utter_booking_cancelled

