version: "3.1"

stories:

# # ============================================================
# # PATH A — Recommendation → Booking
# # ============================================================

- story: recommendation path - happy path
  steps:
    - intent: greet
    - action: utter_greet
    - intent: choose_recommendation_path
    - active_loop: recommendation_form
    - action: action_set_dialog_path          # sets dialog_path = "recommendation"
    - action: utter_ask_district
    - intent: provide_district
    - action: utter_ask_cuisine
    - intent: provide_cuisine
    - action: utter_ask_food_preference
    - intent: provide_food_preference
    - action: action_give_recommendations
    - intent: choose_recommendation
    - action: utter_confirm_recommendation_choice
    - intent: affirm
    - active_loop: null
    - active_loop: booking_form
    - action: utter_ask_num_people
    - intent: provide_party_size
    - action: utter_ask_date
    - intent: provide_date
    - action: utter_ask_time
    - intent: provide_time
    - action: utter_confirm_booking
    - intent: affirm
    - active_loop: null
    - action: utter_booking_confirmed
    - action: utter_ask_restart



