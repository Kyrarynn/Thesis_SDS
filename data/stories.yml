version: "3.1"

stories:

# ============================================================
# PATH A — Recommendation → Booking
# ============================================================

- story: recommendation path - happy path
  steps:
    - intent: greet
    - action: utter_greet
    - intent: want_recommendation
    #- action: action_set_dialog_path        # sets dialog_path = "recommendation"
    #- active_loop: recommendation_form
    - action: utter_ask_district
    - intent: provide_district
    - action: utter_ask_cuisine
    - intent: provide_cuisine
    - action: utter_confirm_recommendation_settings_confirmation
    - intent: affirm
    #- active_loop: null
    - action: utter_give_recommendations
    - action: utter_confirm_recommendation_choice   # returns list, sets restaurant_name slot on choice
    - intent: affirm
    - action: utter_confirm_recommendation_choice
    - intent: affirm
    - action: booking_form
    - active_loop: booking_form
    - active_loop: null
    - action: action_handle_booking         # checks system_version slot; injects difficulty if B
    - intent: affirm
    - action: utter_booking_confirmed

