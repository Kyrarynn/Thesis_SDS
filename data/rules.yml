version: "3.1"

rules:

  # ============================================================
  # ENTRY POINT
  # ============================================================

  - rule: greet user
    steps:
      - intent: greet
      - action: utter_greet
  
  - rule: handle nlu_fallback at top level
    steps:
      - intent: nlu_fallback
      - action: utter_greet

  # ============================================================
  # RECOMMENDATION FORM
  # Collects district, cuisine, food_preference.
  # System A error fires inside validate_recommendation_form
  # on the food_preference slot.
  # ============================================================

  - rule: start recommendation path
    steps:
      - intent: choose_recommendation_path
      - action: recommendation_form
      - active_loop: recommendation_form

  - rule: submit recommendation form
    condition:
      - active_loop: recommendation_form
    steps:
      - action: recommendation_form
      - active_loop: null
      - action: action_give_recommendations

  - rule: handle provide_food_preference inside recommendation form
    condition:
      - active_loop: recommendation_form
    steps:
      - intent: provide_food_preference
      - action: recommendation_form
      - active_loop: recommendation_form

  # "no" inside recommendation form = no dietary preference, not a cancellation
  - rule: handle deny inside recommendation form
    condition:
      - active_loop: recommendation_form
    steps:
      - intent: deny
      - action: recommendation_form
      - active_loop: recommendation_form

  - rule: handle nlu_fallback inside recommendation form
    condition:
      - active_loop: recommendation_form
    steps:
      - intent: nlu_fallback
      - action: action_handle_form_fallback
      - active_loop: recommendation_form

  # ============================================================
  # RESTAURANT SELECTION
  # awaiting_restaurant_choice=True is set by action_give_recommendations.
  # All user inputs at this stage route to action_handle_recommendation_choice
  # which sets restaurant_name and awaiting_booking_start=True.
  # ============================================================

  - rule: user picks a recommendation by name or number
    condition:
      - slot_was_set:
          - awaiting_restaurant_choice: true
    steps:
      - intent: choose_recommendation
      - action: action_handle_recommendation_choice

  # "two", "the second one" etc. classified as provide_party_size — treat as choice
  - rule: handle party size intent as recommendation choice
    condition:
      - slot_was_set:
          - awaiting_restaurant_choice: true
    steps:
      - intent: provide_party_size
      - action: action_handle_recommendation_choice

  # "yes" after seeing the list = pick first / confirm shown restaurant
  - rule: handle affirm as recommendation choice
    condition:
      - slot_was_set:
          - awaiting_restaurant_choice: true
    steps:
      - intent: affirm
      - action: action_handle_recommendation_choice

  # ============================================================
  # RESTAURANT CONFIRMATION
  # Scoped by previous action rather than slot condition, because
  # Rasa evaluates slot conditions before the triggering action
  # commits its SlotSet events — making slot-based conditions
  # unreliable here.
  # ============================================================

  - rule: user confirms restaurant — start booking form
    steps:
      - action: action_handle_recommendation_choice
      - intent: affirm
      - action: booking_form
      - active_loop: booking_form

  - rule: user declines restaurant — re-show recommendations
    steps:
      - action: action_handle_recommendation_choice
      - intent: deny
      - action: action_give_recommendations

  - rule: handle nlu_fallback as recommendation choice
    condition:
      - slot_was_set:
          - awaiting_restaurant_choice: true
    steps:
      - intent: nlu_fallback
      - action: action_handle_recommendation_choice

  # ============================================================
  # BOOKING FORM
  # Collects date, time, num_people.
  # System B error fires inside action_handle_booking.
  # ============================================================

  - rule: submit booking form
    condition:
      - active_loop: booking_form
    steps:
      - action: booking_form
      - active_loop: null
      - action: action_handle_booking

  - rule: handle provide_date inside booking form
    condition:
      - active_loop: booking_form
    steps:
      - intent: provide_date
      - action: booking_form
      - active_loop: booking_form

  - rule: handle provide_time inside booking form
    condition:
      - active_loop: booking_form
    steps:
      - intent: provide_time
      - action: booking_form
      - active_loop: booking_form

  - rule: handle provide_party_size inside booking form
    condition:
      - active_loop: booking_form
    steps:
      - intent: provide_party_size
      - action: booking_form
      - active_loop: booking_form

  - rule: handle affirm inside booking form
    condition:
      - active_loop: booking_form
    steps:
      - intent: affirm
      - action: booking_form
      - active_loop: booking_form

  # "no" inside booking form = nonsense input, re-prompt for current slot
  - rule: handle deny inside booking form
    condition:
      - active_loop: booking_form
    steps:
      - intent: deny
      - action: action_handle_form_fallback
      - active_loop: booking_form

  - rule: handle nlu_fallback inside booking form
    condition:
      - active_loop: booking_form
    steps:
      - intent: nlu_fallback
      - action: action_handle_form_fallback
      - active_loop: booking_form

  # ============================================================
  # SYSTEM B ERROR RECOVERY
  # After System B error: awaiting_booking_start=False, error_fired=True,
  # date slot cleared. User must re-enter date to re-activate booking form.
  # ============================================================

  - rule: re-enter booking form after System B error
    condition:
      - slot_was_set:
          - error_fired: true
      - slot_was_set:
          - awaiting_booking_start: false
    steps:
      - intent: provide_date
      - action: booking_form
      - active_loop: booking_form

  # ============================================================
  # BOOKING CONFIRMATION
  # action_handle_booking sets awaiting_booking_confirmation=True
  # and awaiting_booking_start=False when it sends the summary.
  # ============================================================

  - rule: user affirms booking confirmation
    condition:
      - slot_was_set:
          - awaiting_booking_confirmation: true
    steps:
      - intent: affirm
      - action: utter_booking_confirmed
      - action: utter_ask_restart
      - action: action_reset_after_booking

  - rule: user denies booking confirmation
    condition:
      - slot_was_set:
          - awaiting_booking_confirmation: true
    steps:
      - intent: deny
      - action: utter_booking_cancelled

  # ============================================================
  # GLOBAL
  # ============================================================

  - rule: user stops at any point
    steps:
      - intent: stop
      - action: action_deactivate_loop
      - active_loop: null
      - action: utter_goodbye

  - rule: user ends interaction
    steps:
      - intent: goodbye
      - action: action_deactivate_loop
      - active_loop: null
      - action: utter_goodbye