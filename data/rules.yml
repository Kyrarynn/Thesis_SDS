version: "3.1"

rules:

  # ============================================================
  # ENTRY POINT
  # ============================================================

  - rule: greet user
    steps:
      - intent: greet
      - action: utter_greet

  # ============================================================
  # RECOMMENDATION FORM
  # Collects district, cuisine, food_preference.
  # System A error fires inside validate_recommendation_form
  # (food_preference slot — simulates misunderstanding early in dialog)
  # ============================================================

  - rule: start recommendation path
    steps:
      - intent: choose_recommendation_path
      - action: recommendation_form
      - active_loop: recommendation_form

  - rule: submit recommendation form
    condition:
      - active_loop: recommendation_form
    steps:
      - action: recommendation_form
      - active_loop: null
      - action: action_give_recommendations

  # ============================================================
  # RESTAURANT SELECTION
  # User picks from the list; action sets restaurant_name
  # and asks confirmation before booking form starts.
  # ============================================================

  - rule: user picks a recommendation
    steps:
      - intent: choose_recommendation
      - action: action_handle_recommendation_choice

  - rule: user confirms restaurant to start booking
    condition:
      - slot_was_set:
          - awaiting_booking_start: true
    steps:
      - intent: affirm
      - action: booking_form
      - active_loop: booking_form

  - rule: user declines restaurant choice
    condition:
      - slot_was_set:
          - awaiting_booking_start: true
    steps:
      - intent: deny
      - action: action_give_recommendations    # re-show list so user can pick again

  # ============================================================
  # BOOKING FORM
  # Collects date, time, num_people.
  # System B error fires inside action_handle_booking
  # (booking confirmation — simulates trouble near end of dialog)
  # ============================================================

  - rule: submit booking form
    condition:
      - active_loop: booking_form
    steps:
      - action: booking_form
      - active_loop: null
      - action: action_handle_booking

  - rule: user affirms booking confirmation
    condition:
      - slot_was_set:
          - awaiting_booking_start: false
      - slot_was_set:
          - error_fired: false
      - slot_was_set:
          - restaurant_name: Beta Test - Food Creation  # any non-null
    steps:
      - intent: affirm
      - action: utter_booking_confirmed
      - action: utter_ask_restart

  - rule: user denies booking confirmation
    condition:
      - slot_was_set:
          - awaiting_booking_start: false
      - slot_was_set:
        - error_fired: false
    steps:
      - intent: deny
      - action: utter_booking_cancelled

  # ============================================================
  # Error injection
  # ============================================================

  - rule: re-enter booking form after System B error
    condition:
      - slot_was_set:
          - error_fired: true
      - slot_was_set:
          - awaiting_booking_start: false
    steps:
      - intent: provide_date
      - action: booking_form
      - active_loop: booking_form


  # ============================================================
  # Forms: fallback handling
  # ============================================================
  - rule: handle unexpected input inside recommendation form
    condition:
      - active_loop: recommendation_form
    steps:
      - intent: nlu_fallback
      - action: action_handle_form_fallback
      - active_loop: recommendation_form

  - rule: handle unexpected input inside booking form
    condition:
      - active_loop: booking_form
    steps:
      - intent: nlu_fallback
      - action: action_handle_form_fallback
      - active_loop: booking_form
  
  - rule: handle deny inside recommendation form
    condition:
      - active_loop: recommendation_form
    steps:
      - intent: deny
      - action: recommendation_form
      - active_loop: recommendation_form

  - rule: handle provide_time inside booking form
    condition:
      - active_loop: booking_form
    steps:
      - intent: provide_time
      - action: booking_form
      - active_loop: booking_form

  - rule: handle provide_date inside booking form
    condition:
      - active_loop: booking_form
    steps:
      - intent: provide_date
      - action: booking_form
      - active_loop: booking_form

  - rule: handle provide_party_size inside booking form
    condition:
      - active_loop: booking_form
    steps:
      - intent: provide_party_size
      - action: booking_form
      - active_loop: booking_form
  
  - rule: handle deny inside booking form
    condition:
      - active_loop: booking_form
      - slot_was_set:
          - awaiting_booking_start: true
    steps:
      - intent: deny
      - action: action_handle_form_fallback
      - active_loop: booking_form
  
  - rule: handle affirm inside booking form
    condition:
      - active_loop: booking_form
    steps:
      - intent: affirm
      - action: booking_form
      - active_loop: booking_form

  - rule: handle party size intent as recommendation choice
    condition:
      - slot_was_set:
          - awaiting_booking_start: false
    steps:
      - intent: provide_party_size
      - action: action_handle_recommendation_choice

  - rule: handle affirm as recommendation choice
    condition:
      - slot_was_set:
          - awaiting_booking_start: false
      - slot_was_set:
          - error_fired: false
    steps:
      - intent: affirm
      - action: action_handle_recommendation_choice

  # ============================================================
  # GLOBAL
  # ============================================================

  - rule: user stops
    steps:
      - intent: stop
      - action: action_deactivate_loop
      - active_loop: null
      - action: utter_goodbye