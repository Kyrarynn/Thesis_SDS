version: "3.1"

rules:

- rule: say goodbye whenever the user wants to leave
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: say 'I am a bot' whenever the user asks
  steps:
    - intent: bot_challenge
    - action: utter_iamabot

- rule: handle out of scope messages
  steps:
    - intent: out_of_scope
    - action: utter_default
