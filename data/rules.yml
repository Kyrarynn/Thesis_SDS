version: "3.1"

rules:

  # Keep form active while slots are being filled
  - rule: submit booking form
    condition:
      - active_loop: booking_form
    steps:
      - action: booking_form
      - active_loop: null
      - action: action_handle_booking

  # Hard stop / cancel at any point
  - rule: user stops dialog
    steps:
      - intent: stop
      - action: utter_booking_cancelled
      - action: action_deactivate_loop
      - active_loop: null
