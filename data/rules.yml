  # Hard stop / cancel at any point
  - rule: user stops dialog
    steps:
      - intent: stop
      - action: utter_booking_cancelled
      - active_loop: null
#       - action: utter_ask_restart

# Say goodbye
  - rule: say goodbye when user does so 
    steps:
      - intent: goodbye
      - action: utter_goodbye
      - active_loop: null




