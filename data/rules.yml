version: "3.1"

rules: 

  # - rule: restart at any point
  #   steps: 
  #     - intent: restart
  #     - active_loop: null
  #     - action: utter_ask_restart

# # Hard stop / cancel at any point
#   - rule: user stops
#     steps:
#       - intent: stop
#       - action: action_deactivate_loop
#       - active_loop: null
#       - action: utter_goodbye

  # ============================================================
  # ENTRY POINT
  # ============================================================
 
  - rule: greet user
    steps:
      - intent: greet
      - action: utter_greet
 
  # ============================================================
  # PATH A — Recommendation
  # ============================================================
 

  - rule: start recommendation path
    steps:
      - intent: choose_recommendation_path
      - action: action_set_dialog_path
      - action: recommendation_form
      - active_loop: recommendation_form
 
  - rule: submit recommendation form
    condition:
      - active_loop: recommendation_form
    steps:
      - action: recommendation_form
      - active_loop: null
      - action: action_give_recommendations
 
  - rule: user confirms recommendation choice
    steps:
      - intent: choose_recommendation
      - action: action_handle_recommendation_choice
      - action: utter_confirm_recommendation_choice
      - action: booking_form
      - active_loop: booking_form
 
  # ============================================================
  # PATH B — Direct Booking
  # ============================================================
 
  - rule: start direct booking path
    steps:
      - intent: choose_own_restaurant
      - action: action_set_dialog_path
      - action: action_confirm_restaurant_name
 
  - rule: user provides restaurant name
    steps:
      - intent: provide_restaurant_name
      - action: action_confirm_restaurant_name
 
  - rule: user affirms restaurant name
    condition:
      - slot_was_set:
          - awaiting_restaurant_confirmation: true
    steps:
      - intent: affirm
      - action: booking_form
      - active_loop: booking_form
 
  - rule: user denies restaurant name
    condition:
      - slot_was_set:
          - awaiting_restaurant_confirmation: true
    steps:
      - intent: deny
      - action: action_confirm_restaurant_name
 
  # ============================================================
  # BOOKING FORM — shared by both paths
  # ============================================================
 
  - rule: submit booking form
    condition:
      - active_loop: booking_form
    steps:
      - action: booking_form
      - active_loop: null
      - action: action_handle_booking
 
  - rule: user affirms booking confirmation
    condition:
      - slot_was_set:
          - awaiting_restaurant_confirmation: false
    steps:
      - intent: affirm
      - action: utter_booking_confirmed
      - action: utter_ask_restart
 
  - rule: user denies booking confirmation
    condition:
      - slot_was_set:
          - awaiting_restaurant_confirmation: false
    steps:
      - intent: deny
      - action: utter_booking_cancelled
 
  # ============================================================
  # GLOBAL — stop at any point
  # ============================================================
 
  - rule: user stops
    steps:
      - intent: stop
      - action: action_deactivate_loop
      - active_loop: null
      - action: utter_goodbye
