<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Assistant Study</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 { font-size: 1.2rem; color: #333; margin-bottom: 20px; font-weight: 500; }

    /* ── Setup panel ── */
    #setup-panel {
      background: white;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    #setup-panel label { display: block; font-size: 0.9rem; color: #555; margin-bottom: 6px; }

    #setup-panel input,
    #setup-panel select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    #start-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    #start-btn:hover { background: #1d4ed8; }

    /* ── Chat panel ── */
    #chat-panel {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 680px;
      height: calc(100vh - 80px);
    }

    #chat-log {
      flex: 1;
      overflow-y: auto;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 12px;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .bubble.user {
      background: #2563eb;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .bubble.bot {
      background: #f0f0f0;
      color: #222;
      border-bottom-left-radius: 4px;
    }

    /* ── Rating widget ── */
    .rating-block {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 12px;
      font-size: 0.88rem;
      color: #555;
    }

    .rating-block p { margin-bottom: 8px; }

    .stars { display: flex; gap: 8px; }

    .star-btn {
      background: none;
      border: 2px solid #d1d5db;
      border-radius: 6px;
      width: 40px;
      height: 40px;
      font-size: 1rem;
      cursor: pointer;
      color: #374151;
      font-weight: 600;
      transition: all 0.1s;
    }

    .star-btn:hover, .star-btn.selected {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }

    /* ── Controls ── */
    #controls { display: flex; align-items: center; gap: 12px; }

    #mic-btn {
      flex: 1;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    #mic-btn.recording { background: #dc2626; animation: pulse 1.2s infinite; }
    #mic-btn.processing { background: #d97706; }
    #mic-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    #status { font-size: 0.8rem; color: #888; text-align: center; margin-top: 6px; }

    #end-btn {
      padding: 14px 20px;
      background: #6b7280;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    #end-btn:hover { background: #4b5563; }
  </style>
</head>
<body>

<!-- ── Setup ── -->
<div id="setup-panel">
  <h1>Restaurant Booking Assistant</h1>

  <label for="participant-number">Participant number</label>
  <input type="number" id="participant-number" min="1" placeholder="e.g. 1">

  <label for="system-version">System version</label>
  <select id="system-version">
    <option value="A">A: early error</option>
    <option value="B">B: late error</option>
  </select>

  <button id="start-btn" onclick="startSession()">Start session</button>
  <p id="setup-error" style="color:red;font-size:0.85rem;margin-top:8px;"></p>
</div>

<!-- ── Chat ── -->
<div id="chat-panel">
  <div id="chat-log"></div>
  <div id="controls">
    <button id="mic-btn" onmousedown="startRecording()" onmouseup="stopRecording()">
      Hold to speak
    </button>
    <button id="end-btn" onclick="endSession()">End</button>
  </div>
  <p id="status"></p>
</div>

<script>
// ── State ──
let participantId  = null;
let turnIndex      = 0;
let pendingRating  = false;
let mediaRecorder  = null;
let audioChunks    = [];
let synth          = window.speechSynthesis;

// ── Session start ──
async function startSession() {
  const num = parseInt(document.getElementById('participant-number').value);
  const ver = document.getElementById('system-version').value;

  if (!num || num < 1) {
    document.getElementById('setup-error').textContent = 'Please enter a valid participant number.';
    return;
  }

  const res = await fetch('/session/start', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({participant_number: num, system_version: ver}),
  });

  if (!res.ok) {
    document.getElementById('setup-error').textContent =
      'Could not connect to server. Is Rasa running?';
    return;
  }

  const data = await res.json();
  participantId = data.participant_id;

  document.getElementById('setup-panel').style.display = 'none';
  document.getElementById('chat-panel').style.display  = 'flex';

  setStatus('Session started. Hold the microphone button to speak.');
}

// ── Audio recording ──
async function startRecording() {
  if (pendingRating) {
    setStatus('Please rate the last response before continuing.');
    return;
  }

  audioChunks = [];

  const stream = await navigator.mediaDevices.getUserMedia({audio: true});

  let options = {};
  if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
    options = { mimeType: 'audio/webm;codecs=opus' };
  } else if (MediaRecorder.isTypeSupported('audio/webm')) {
    options = { mimeType: 'audio/webm' };
  } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
    options = { mimeType: 'audio/mp4' };
  }

  mediaRecorder = new MediaRecorder(stream, options);
  // mediaRecorder = new MediaRecorder(stream, {mimeType: 'audio/webm'});

  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) audioChunks.push(e.data);
  };

  mediaRecorder.onstop = async () => {
    // Stop all tracks to release microphone
    stream.getTracks().forEach(t => t.stop());
    await processAudio();
  };

  mediaRecorder.start();

  const micBtn = document.getElementById('mic-btn');
  micBtn.classList.add('recording');
  micBtn.textContent = 'Recording…';
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();

    const micBtn = document.getElementById('mic-btn');
    micBtn.classList.remove('recording');
    micBtn.classList.add('processing');
    micBtn.textContent = 'Transcribing…';
    micBtn.disabled = true;
  }
}

// ── Send audio to Whisper via FastAPI ──
async function processAudio() {
  setStatus('Transcribing…');

  const blob     = new Blob(audioChunks, {type: 'audio/webm'});
  const formData = new FormData();
  formData.append('audio', blob, 'recording.webm');

  let transcript = '';
  try {
    const res = await fetch('/transcribe', {method: 'POST', body: formData});
    
    if (!res.ok) {
      const errText = await res.text(); // Get raw response text first
      console.error('Server error response:', errText);
      setStatus('Transcription failed on server. See console.');
      resetMic();
      return;
    }

    const data = await res.json();
    transcript = data.text;
  } catch (e) {
    console.error('Network or parsing error:', e);
    setStatus('Transcription failed. Check console.');
    resetMic();
    return;
  }

  if (!transcript) {
    setStatus('Nothing was heard. Please try again.');
    resetMic();
    return;
  }

  addBubble(transcript, 'user');
  await sendMessage(transcript);
}

// ── Send transcribed text to Rasa via FastAPI ──
async function sendMessage(text) {
  setStatus('Processing…');

  const res  = await fetch('/message', {
    method:  'POST',
    headers: {'Content-Type': 'application/json'},
    body:    JSON.stringify({participant_id: participantId, user_text: text}),
  });

  const data    = await res.json();
  const botText = data.bot_text;

  if (botText) {
    addBubble(botText, 'bot');
    speak(botText, () => {
      showRating(turnIndex);
      turnIndex++;
    });
  }

  setStatus('');
  resetMic();
}

// ── TTS ──
function speak(text, onDone) {
  synth.cancel();
  const utt  = new SpeechSynthesisUtterance(text);
  utt.lang   = 'en-GB';
  utt.rate   = 0.95;
  utt.onend  = onDone;
  synth.speak(utt);
}

// ── IQ rating widget ──
function showRating(index) {
  pendingRating = true;
  document.getElementById('mic-btn').disabled = true;

  const block = document.createElement('div');
  block.className = 'rating-block';
  block.innerHTML = `
    <p>How well did the system understand and respond? (1 = very poor, 5 = very good)</p>
    <div class="stars">
      ${[1,2,3,4,5].map(n =>
        `<button class="star-btn" onclick="submitRating(${index}, ${n}, this)">${n}</button>`
      ).join('')}
    </div>
  `;
  document.getElementById('chat-log').appendChild(block);
  scrollToBottom();
}

async function submitRating(turnIdx, rating, btn) {
  btn.closest('.stars').querySelectorAll('.star-btn')
     .forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');

  await fetch('/rating', {
    method:  'POST',
    headers: {'Content-Type': 'application/json'},
    body:    JSON.stringify({
      participant_id: participantId,
      turn_index:     turnIdx,
      rating:         rating,
    }),
  });

  btn.closest('.rating-block').querySelectorAll('.star-btn')
     .forEach(b => b.disabled = true);

  pendingRating = false;
  resetMic();
  setStatus('Rating submitted. Hold the button to speak again.');
}

// ── End session ──
async function endSession() {
  if (!confirm('End the session?')) return;

  await fetch(`/session/end?participant_id=${participantId}`, {method: 'POST'});

  document.getElementById('chat-panel').innerHTML =
    '<p style="text-align:center;color:#555;margin-top:80px;font-size:1.1rem;">' +
    'Session complete. Thank you!<br><br>' +
    '<span style="font-size:0.9rem;color:#888;">Please hand the device back to the researcher.</span>' +
    '</p>';
}

// ── Helpers ──
function resetMic() {
  const micBtn = document.getElementById('mic-btn');
  micBtn.classList.remove('recording', 'processing');
  micBtn.textContent = 'Hold to speak';
  micBtn.disabled = false;
}

function addBubble(text, sender) {
  const div = document.createElement('div');
  div.className  = `bubble ${sender}`;
  div.textContent = text;
  document.getElementById('chat-log').appendChild(div);
  scrollToBottom();
}

function scrollToBottom() {
  const log = document.getElementById('chat-log');
  log.scrollTop = log.scrollHeight;
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}
</script>
</body>
</html>
