version: "3.1"

intents:
  - greet
  - choose_recommendation_path
  - choose_recommendation
  - provide_district
  - provide_cuisine
  - provide_food_preference
  - provide_party_size
  - provide_date
  - provide_time
  - affirm
  - deny
  - stop

entities:
  - district
  - cuisine
  - food_preference
  - restaurant_name
  - date
  - time
  - num_people

slots:

  # Set externally by FastAPI at session start — "A" or "B"
  system_version:
    type: categorical
    values:
      - A
      - B
    initial_value: null
    mappings:
      - type: custom

  # for rules
  awaiting_booking_confirmation:
    type: bool
    initial_value: false
    mappings:
      - type: custom
  
  awaiting_restaurant_choice:
    type: bool
    initial_value: false
    mappings:
      - type: custom

  # Recommendation form slots
  district:
    type: text
    mappings:
      - type: from_entity
        entity: district

  cuisine:
    type: text
    mappings:
      - type: from_entity
        entity: cuisine

  food_preference:
    type: text
    mappings:
      - type: from_entity
        entity: food_preference

  # Booking form slots
  restaurant_name:
    type: text
    mappings:
      - type: from_entity
        entity: restaurant_name

  date:
    type: text
    mappings:
      - type: from_entity
        entity: date

  time:
    type: text
    mappings:
      - type: from_entity
        entity: time

  num_people:
    type: float
    mappings:
      - type: from_entity
        entity: num_people

  # Stores the recommendation list so ActionHandleRecommendationChoice can resolve choices
  recommendations:
    type: list
    mappings:
      - type: custom

  # Gates the booking form start after restaurant confirmation
  awaiting_booking_start:
    type: bool
    initial_value: false
    mappings:
      - type: custom

  # Tracks how many times System B has injected an error at the booking stage
  # Used to ensure the error only fires once, then resolves
  error_fired:
    type: bool
    initial_value: false
    mappings:
      - type: custom

responses:
  utter_greet:
    - text: "Hello! I can help you find and book a restaurant. Let me know if you are ready to start!"

  utter_ask_district:
    - text: "Which district are you looking in?"

  utter_ask_cuisine:
    - text: "What cuisine are you in the mood for?"

  utter_ask_food_preference:
    - text: "Do you have any dietary preferences? For example, vegan, vegetarian, halal, or gluten free — or no preference."

  utter_ask_date:
    - text: "What date works for you?"

  utter_ask_time:
    - text: "What time would you like the reservation?"

  utter_ask_num_people:
    - text: "How many people will be dining?"

  utter_booking_confirmed:
    - text: "Perfect, your reservation is confirmed. Enjoy your meal!"

  utter_booking_cancelled:
    - text: "No problem, the booking has been cancelled."

  utter_ask_restart:
    - text: "Is there anything else I can help you with?"

  utter_goodbye:
    - text: "Goodbye! Hope to see you again soon."

actions:
  - action_give_recommendations
  - action_handle_recommendation_choice
  - action_handle_booking
  - validate_recommendation_form
  - validate_booking_form
  - action_handle_form_fallback

forms:
  recommendation_form:
    required_slots:
      - district
      - cuisine
      - food_preference

  booking_form:
    required_slots:
      - date
      - time
      - num_people