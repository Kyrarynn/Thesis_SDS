version: "3.1"

intents:
  - greet
  - want_recommendation
  - want_booking
  - inform
  - affirm
  - deny
  - stop
  - provide_cuisine
  - confirm_booking
  - provide_time
  - provide_party_size

entities:
  - district
  - cuisine
  - restaurant_name
  - time
  - date
  - num_people

slots:
  dialog_path:
    type: categorical
    values:
      - recommendation
      - direct_booking
    initial_value: null
    mappings:
      - type: custom

  district:
    type: text
    mappings:
      - type: from_entity
        entity: district

  cuisine:
    type: text
    mappings:
      - type: from_entity
        entity: cuisine

  restaurant_name:
    type: text
    mappings:
      - type: from_entity
        entity: restaurant_name

  time:
    type: text
    mappings:
      - type: from_entity
        entity: time

  date:
    type: text
    mappings:
      - type: from_entity
        entity: date

  num_people:
    type: float
    mappings:
      - type: from_entity
        entity: num_people

  # System A/B condition assigned at session start by FastAPI
  system_version:
    type: categorical
    values:
      - A
      - B
    initial_value: null
    mappings:
      - type: custom

responses:
  utter_greet:
    - text: "Hello! I can help you find a restaurant or make a booking. Would you like a recommendation, or do you already have a place in mind?"

  utter_ask_district:
    - text: "Which district are you looking in?"

  utter_ask_cuisine:
    - text: "What cuisine are you in the mood for?"

  utter_give_recommendations:
    - text: "Here are some options based on your preferences: [Restaurant A], [Restaurant B], [Restaurant C]. Would you like to book one of these?"

  utter_ask_restaurant_name:
    - text: "Which restaurant would you like to book?"

  utter_confirm_recommendation_choice:
    - text: "Great choice! Shall I go ahead and book that for you?"

  utter_ask_time:
    - text: "What time would you like the reservation?"

  utter_ask_date:
    - text: "What date works for you?"

  utter_ask_num_people:
    - text: "How many people will be dining?"

  utter_confirm_booking:
    - text: "Just to confirm: {restaurant_name} on {date} at {time} for {num_people} people. Does that sound right?"

  utter_booking_confirmed:
    - text: "Perfect, your reservation is confirmed. Enjoy your meal!"

  utter_booking_cancelled:
    - text: "No problem, the booking has been cancelled."

  utter_ask_restart:
    - text: "Is there anything else I can help you with?"

  # System B difficulty injections (stubs — flesh out in custom actions)
  utter_booking_error_system_b:
    - text: "I'm sorry, I'm having trouble processing that. Could you repeat the date?"

actions:
  - action_set_dialog_path
  - action_handle_booking
  - action_give_recommendations
  - validate_booking_form

forms:
  booking_form:
    required_slots:
      - restaurant_name
      - date
      - time
      - num_people
