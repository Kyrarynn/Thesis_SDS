version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - restart
  - choose_recommendation_path
  - provide_district
  - provide_cuisine
  - provide_food_preference
  - choose_recommendation
  - provide_party_size
  - provide_date
  - provide_time
  - confirm_booking
  - choose_own_restaurant
  - provide_restaurant_name
  

entities:
  - district
  - cuisine
  - food_preference
  - restaurant_name
  - time
  - date
  - num_people

slots:
  dialog_path:
    type: categorical
    values:
      - recommendation
      - direct_booking
    initial_value: null
    influence_conversation: true
    mappings:
      - type: custom

  district:
    type: text
    mappings:
      - type: from_entity
        entity: district

  food_preference:
    type: text
    mappings:
      - type: from_entity
        entity: food_preference

  cuisine:
    type: text
    mappings:
      - type: from_entity
        entity: cuisine

  restaurant_name:
    type: text
    mappings:
      - type: from_entity
        entity: restaurant_name

  time:
    type: text
    mappings:
      - type: from_entity
        entity: time

  date:
    type: text
    mappings:
      - type: from_entity
        entity: date

  num_people:
    type: float
    mappings:
      - type: from_entity
        entity: num_people

  # System A/B condition assigned at session start by FastAPI
  system_version:
    type: categorical
    values:
      - A
      - B
    initial_value: null
    mappings:
      - type: custom
  
  confirmation:
    type: bool
    mappings:
      - type: from_intent
        intent: affirm
        value: true
      - type: from_intent
        intent: deny
        value: false



responses:
  utter_greet:
    - text: "Hello! I am a Bot that can help you find a restaurant or make a reservation. Would you like a recommendation, or do you already have a place in mind?"
  
  utter_ask_restaurant_name:
    - text: "Got it. Which restaurant would you like to book? Please tell me the name."


  utter_ask_district:
    - text: "Let me ask some questions to get a feel for your preferences. Which district are you looking in?"

  utter_ask_cuisine:
    - text: "What cuisine are you in the mood for? Italian, Japanese or Mexican are popular nowadays."
  
  utter_ask_food_preference:
    - text: "One last question: Do you have specific food preferences? For example, would you like a place with vegan or gluten free options."

  utter_give_recommendations:
    - text: "Here are some options based on your preferences: [Restaurant A], [Restaurant B], [Restaurant C]. Would you like to book one of these?"

  utter_confirm_recommendation_choice:
    - text: "Great choice! Shall we proceed to booking a table?"

  utter_ask_time:
    - text: "What time would you like the reservation?"

  utter_ask_date:
    - text: "What date works for you?"

  utter_ask_num_people:
    - text: "How many people will be dining?"

  utter_confirm_booking:
    - text: "Just to confirm: {restaurant_name} on {date} at {time} for {num_people} people. Does that sound right?"

  utter_booking_confirmed:
    - text: "Perfect, your reservation is confirmed. Enjoy your meal!"

  utter_booking_cancelled:
    - text: "No problem, the booking has been cancelled."

  utter_ask_restart:
    - text: "Is there anything else I can help you with? Make a booking or give a recommendation?"

  # System B difficulty injections (stubs — flesh out in custom actions)
  utter_booking_error_system_b:
    - text: "I'm sorry, I'm having trouble processing that. Could you repeat the date?"

actions:
  - action_set_dialog_path
  - action_handle_booking
  - action_give_recommendations
  - validate_booking_form

forms:
  booking_form:
    required_slots:
      - restaurant_name
      - date
      - time
      - num_people

  recommendation_form:
    required_slots:
      - district
      - food_preference
      - cuisine
